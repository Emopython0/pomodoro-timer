<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusSpace Pro - Aesthetic Pomodoro</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --panel-glass: rgba(30, 41, 59, 0.4);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-default: #38bdf8;
            --shadow-glow: rgba(56, 189, 248, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* Glassmorphic Panel Container */
        .glass-panel {
            background: var(--panel-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            padding: 3.5rem 2.5rem;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 340px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel:hover {
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 30px var(--shadow-glow);
            border-color: rgba(255,255,255,0.15);
        }

        /* Micro-Typography */
        .brand-header {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        /* Chrono Display engine */
        .chrono-display {
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 2.5rem;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        /* Tactical Button Systems */
        .btn-action {
            background: var(--text-primary);
            border: none;
            color: var(--bg-deep);
            padding: 1rem 3rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            background: #ffffff;
        }

        .btn-action:active {
            transform: translateY(0);
        }

        /* Configuration Nodes / Selectors */
        .theme-selector {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .theme-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .theme-dot.active {
            border-color: #ffffff;
            transform: scale(1.2);
        }

        /* Native Ambient Noise Generators */
        .audio-node {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease;
        }
        .audio-node:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="glass-panel">
    <div class="brand-header" id="sessionStatus">Focus Session</div>
    <div class="chrono-display" id="timeDisplay">25:00</div>
    <div class="controls">
        <button class="btn-action" id="triggerBtn" onclick="toggleEngine()">START</button>
    </div>
    
    <div class="theme-selector">
        <div class="theme-dot active" style="background: #38bdf8;" onclick="switchTheme('#090d16', '#38bdf8', this)"></div>
        <div class="theme-dot" style="background: #f43f5e;" onclick="switchTheme('#110608', '#f43f5e', this)"></div>
        <div class="theme-dot" style="background: #10b981;" onclick="switchTheme('#040d0a', '#10b981', this)"></div>
    </div>

    <div class="audio-node" onclick="toggleAudioHint()">🎵 Click for Audio Alert Test</div>
</div>

<script>
    let timeLeft = 25 * 60;
    let runningState = false;
    let engineInterval = null;

    function renderDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const completeString = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        document.getElementById('timeDisplay').textContent = completeString;
        document.title = `(${completeString}) FocusSpace`;
    }

    function toggleEngine() {
        const stateBtn = document.getElementById('triggerBtn');
        if (runningState) {
            clearInterval(engineInterval);
            stateBtn.textContent = 'START';
            runningState = false;
        } else {
            runningState = true;
            stateBtn.textContent = 'PAUSE';
            engineInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    renderDisplay();
                } else {
                    triggerAlertNotification();
                }
            }, 1000);
        }
    }

    function triggerAlertNotification() {
        clearInterval(engineInterval);
        runningState = false;
        document.getElementById('triggerBtn').textContent = 'START';
        timeLeft = 25 * 60;
        renderDisplay();
        
        // Native Web Audio API Sound Generation Architecture (No external asset dependency)
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const osc = context.createOscillator();
        const gain = context.createGain();
        osc.connect(gain);
        gain.connect(context.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, context.currentTime); // C5 clean tone note
        gain.gain.setValueAtTime(0.3, context.currentTime);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, context.currentTime + 1.5);
        osc.stop(context.currentTime + 1.5);

        alert("Focus block achieved successfully. Initiate recovery break.");
    }

    function switchTheme(bg, accent, element) {
        document.body.style.backgroundColor = bg;
        document.documentElement.style.setProperty('--shadow-glow', `${accent}26`);
        document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
        element.classList.add('active');
    }

    function toggleAudioHint() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.setValueAtTime(440, ctx.currentTime);
        g.gain.setValueAtTime(0.1, ctx.currentTime);
        o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
        o.stop(ctx.currentTime + 0.5);
    }
</script>
</body>
</html>
