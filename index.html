<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumWave - 2D Ripple Tank Simulation</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --panel-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-light: #f8fafc;
            --accent-glow: #38bdf8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--panel-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 780px;
            box-sizing: border-box;
        }

        .app-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }

        canvas {
            background: #000;
            border-radius: 14px;
            border: 1px solid var(--border-glass);
            cursor: crosshair;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1;
        }

        .controls-panel {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(0,0,0,0.3);
            padding: 1.2rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
            margin: 0;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-light);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .preset-btn:hover, .preset-btn.active {
            background: var(--accent-glow);
            color: var(--bg-deep);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            border-color: var(--accent-glow);
        }

        .telemetry-log {
            font-size: 0.8rem;
            color: #94a3b8;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Wave Dynamics Lab // Ripple Tank</h1>
    
    <div class="app-layout">
        <!-- Render Matrix Canvas Layer -->
        <canvas id="tankCanvas" width="160" height="160"></canvas>

        <div class="controls-panel">
            <div style="font-size: 0.75rem; font-weight: bold; color: #64748b; letter-spacing: 1px;">PHENOMENA SELECTOR</div>
            
            <button class="preset-btn active" onclick="setPreset('reflection', this)">1. Reflection (Wall Barrier)</button>
            <button class="preset-btn" onclick="setPreset('refraction', this)">2. Refraction (Dense Medium Slit)</button>
            <button class="preset-btn" onclick="setPreset('diffraction-gap', this)">3. Diffraction (Aperture Slit)</button>
            <button class="preset-btn" onclick="setPreset('diffraction-edge', this)">4. Diffraction (Knife Edge Boundary)</button>
            <button class="preset-btn" style="background: rgba(239, 68, 68, 0.1); border-color: rgba(239,68,68,0.2); color: #f87171;" onclick="clearMatrix()">Reset Wave Field</button>

            <div class="telemetry-log" id="logField">
                System Initialized: Click/drag on the viewport container grid to inject instant mechanical energy arrays.
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('tankCanvas');
    const ctx = canvas.getContext('2d');
    const logField = document.getElementById('logField');

    const RES = 160; 
    const TOTAL_CELLS = RES * RES;

    // Utilize separate 1D Float32 typed memory buffers to force raw arithmetic speed
    let waveCurrent = new Float32Array(TOTAL_CELLS);
    let wavePrevious = new Float32Array(TOTAL_CELLS);
    let staticObstacles = new Uint8Array(TOTAL_CELLS);
    let baselineVelocityMap = new Float32Array(TOTAL_CELLS);

    let environmentPreset = 'reflection';
    let waveOscillationCounter = 0;

    function buildEnvironmentMesh() {
        staticObstacles.fill(0);
        baselineVelocityMap.fill(0.45); 

        if (environmentPreset === 'reflection') {
            logField.textContent = "Log: Rigid vertical wall aligned at x=120. Observe mechanical plane waves rebounding cleanly back into the grid space.";
            for (let y = 0; y < RES; y++) {
                if (y > 20 && y < 140) {
                    staticObstacles[120 + y * RES] = 1;
                }
            }
        } 
        else if (environmentPreset === 'refraction') {
            logField.textContent = "Log: Slow-velocity dense glass medium rendered from x=80 onward. Notice immediate phase slowing and spatial wavelength compression.";
            for (let x = 80; x < RES; x++) {
                for (let y = 0; y < RES; y++) {
                    baselineVelocityMap[x + y * RES] = 0.12; 
                }
            }
        } 
        else if (environmentPreset === 'diffraction-gap') {
            logField.textContent = "Log: 16-pixel single slit aperture block at x=80. Plane wavefronts squeeze inside and radiate outward spherically.";
            for (let y = 0; y < RES; y++) {
                if (y < 72 || y > 88) {
                    staticObstacles[80 + y * RES] = 1;
                }
            }
        } 
        else if (environmentPreset === 'diffraction-edge') {
            logField.textContent = "Log: Single structural corner tip deployed at x=80. Observe wave energy curling around the boundary vector boundaries.";
            for (let y = 80; y < RES; y++) {
                staticObstacles[80 + y * RES] = 1;
            }
        }
    }

    function setPreset(name, buttonElement) {
        environmentPreset = name;
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        buttonElement.classList.add('active');
        clearMatrix();
    }

    function clearMatrix() {
        waveCurrent.fill(0);
        wavePrevious.fill(0);
        buildEnvironmentMesh();
    }

    // Mathematical Numerical Propagation Engine Frame Loop
    function computeWaveInferenceStep() {
        waveOscillationCounter += 0.3;
        
        // Continuous harmonic driver plane wave grid generation on left border coordinates
        for (let y = 4; y < RES - 4; y++) {
            waveCurrent[4 + y * RES] = Math.sin(waveOscillationCounter) * 3.5;
        }

        // Discrete Finite-Difference Wave Engine Solution Equation Pass
        for (let y = 1; y < RES - 1; y++) {
            const rowOffset = y * RES;
            for (let x = 1; x < RES - 1; x++) {
                const idx = x + rowOffset;

                if (staticObstacles[idx] === 1) {
                    waveCurrent[idx] = 0; 
                    continue;
                }

                // 2D Finite Discrete Laplacian Calculus approximation array operations
                const spatialAcceleration = (
                    wavePrevious[idx + 1] +
                    wavePrevious[idx - 1] +
                    wavePrevious[idx + RES] +
                    wavePrevious[idx - RES] - 4 * wavePrevious[idx]
                ) * baselineVelocityMap[idx];

                waveCurrent[idx] = (2 * wavePrevious[idx] - waveCurrent[idx] + spatialAcceleration) * 0.99;
            }
        }

        let storageSwapBuffer = waveCurrent;
        waveCurrent = wavePrevious;
        wavePrevious = storageSwapBuffer;
    }

    // High-Performance Dynamic Canvas Byte Pipeline Rendering
    function processDisplayPipeline() {
        computeWaveInferenceStep();

        const canvasImageData = ctx.createImageData(RES, RES);
        const coreBytePixels = canvasImageData.data;

        for (let i = 0; i < TOTAL_CELLS; i++) {
            const pixelByteIndex = i * 4;

            if (staticObstacles[i] === 1) {
                coreBytePixels[pixelByteIndex] = 100;
                coreBytePixels[pixelByteIndex + 1] = 116;
                coreBytePixels[pixelByteIndex + 2] = 139;
                coreBytePixels[pixelByteIndex + 3] = 255;
            } else {
                const signalAmplitude = wavePrevious[i] * 110;

                if (signalAmplitude > 0) {
                    coreBytePixels[pixelByteIndex] = 56;
                    coreBytePixels[pixelByteIndex + 1] = 189;
                    coreBytePixels[pixelByteIndex + 2] = 248;
                    coreBytePixels[pixelByteIndex + 3] = Math.min(255, signalAmplitude * 3);
                } else {
                    coreBytePixels[pixelByteIndex] = 9;
                    coreBytePixels[pixelByteIndex + 1] = 13;
                    coreBytePixels[pixelByteIndex + 2] = 22;
                    coreBytePixels[pixelByteIndex + 3] = Math.min(255, -signalAmplitude * 3);
                }
            }
