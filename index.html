<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusSpace - Minimalist Pomodoro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 320px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 2rem; color: var(--text-dim); letter-spacing: 1px; }
        .timer { font-size: 5rem; font-weight: bold; margin-bottom: 2rem; font-variant-numeric: tabular-nums; }
        .controls button {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 0.75rem 2rem;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .controls button:hover {
            background: var(--accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FOCUS // SPACE</h1>
    <div class="timer" id="display">25:00</div>
    <div class="controls">
        <button id="startBtn" onclick="toggleTimer()">START</button>
    </div>
</div>

<script>
    let timeLeft = 25 * 60;
    let timerId = null;
    let isRunning = false;

    function updateDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('display').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
        const btn = document.getElementById('startBtn');
        if (isRunning) {
            clearInterval(timerId);
            btn.textContent = 'START';
            isRunning = false;
        } else {
            isRunning = true;
            btn.textContent = 'PAUSE';
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    alert("Session complete! Take a break.");
                    timeLeft = 25 * 60;
                    updateDisplay();
                    btn.textContent = 'START';
                    isRunning = false;
                }
            }, 1000);
        }
    }
</script>
</body>
</html>
